name: Liquid Glass build

# 在 Linux + Theos + iOS SDK 里，把 VidGrab 自己的 Objective-C 源码全编一遍，
# 确认「液态玻璃」改动没有语法错误。
#
# 注意：这里不出 IPA。完整打包还要 Python.framework、ffmpeg 静态库、whisper 源码和
# 预编译的 yt-dlp 包，那些是作者本机环境里的私有依赖，不在仓库里。

on:
  push:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl xz-utils git make perl clang lld llvm libc++-dev libc++abi-dev libncurses5 2>/dev/null || true

      - name: 安装 Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"
          # 用 Linux 本机的 clang/lld 当工具链（theos 自带的 Darwin 交叉链条在 x86 上跑不起来）
          echo "THEOS_PLATFORM_NAME=" >> "$GITHUB_ENV"

      - name: 下载 iOS SDK
        run: |
          mkdir -p "$HOME/theos/sdks"
          URL=$(curl -s https://api.github.com/repos/theos/sdks/releases/latest \
                | grep -oE '"browser_download_url": *"[^"]*iPhoneOS16\.5\.sdk\.tar\.xz"' \
                | head -1 | cut -d'"' -f4)
          echo "下载 $URL"
          curl -sL "$URL" -o sdk.tar.xz
          file sdk.tar.xz || true
          tar xJf sdk.tar.xz -C "$HOME/theos/sdks/"
          ls "$HOME/theos/sdks/"

      - name: 编译（只看 VidGrab 自己的源码）
        run: |
          set -o pipefail
          make -f Makefile.syntax -j"$(nproc)" TARGET=iphone:clang:16.5:15.0 ARCHS=arm64 FINALPACKAGE=1 2>&1 | tee build.log | tail -n 60
          echo "=== 错误汇总 ==="
          grep -E "error:" build.log | sort -u | head -40
          if grep -qE "error:" build.log; then exit 1; fi
